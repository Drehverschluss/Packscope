modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Drehverschluss/Packscope/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/Drehverschluss/Packscope"
authors="${mod_authors}"
description='''${mod_description}'''
# Client-only mod without a server part: never mark a server as incompatible
displayTest="IGNORE_ALL_VERSION"

# Accessors only, client section (never applied on a dedicated server)
[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    # Optional: conflict icons and details in the Packed Packs screen as well
    modId="packed_packs"
    type="optional"
    versionRange="${packed_packs_version_range}"
    ordering="AFTER"
    side="CLIENT"
