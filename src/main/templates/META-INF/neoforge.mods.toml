modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Drehverschluss/Packscope/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/Drehverschluss/Packscope"
logoFile="packscope.png"
logoBlur=false
authors="${mod_authors}"
credits="Idea from the conflict view of Mod Organizer 2. Optional Packed Packs support through the public Packed Packs API by fishstiz (MIT), not affiliated. See CREDITS.md in the source repository."
description='''${mod_description}'''
# Client-only mod without a server part: never mark a server as incompatible
displayTest="IGNORE_ALL_VERSION"

# Client section only (never applied on a dedicated server): accessors and the vanilla pack screen hooks
[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    # Optional: conflict icons and details in the Packed Packs screen as well
    modId="packed_packs"
    type="optional"
    versionRange="${packed_packs_version_range}"
    ordering="AFTER"
    side="CLIENT"
